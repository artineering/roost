# Manager config reproducing the Sphero deployment: four Raspberry Pi 4 hosts,
# four Spheros (BLE links) each. Replace the placeholder addresses.
#
# Do not commit a real token. Leave it out and export ROOST_TOKEN instead.
agent:
  token: ""

hosts:
  - {name: rpi4-node01, host: 10.0.0.11, port: 8181, capacity: 4}
  - {name: rpi4-node02, host: 10.0.0.12, port: 8181, capacity: 4}
  - {name: rpi4-node03, host: 10.0.0.13, port: 8181, capacity: 4}
  - {name: rpi4-node04, host: 10.0.0.14, port: 8181, capacity: 4}
